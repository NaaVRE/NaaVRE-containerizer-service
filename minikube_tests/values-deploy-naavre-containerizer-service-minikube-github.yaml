global:
  namespace: naavre
jupyterhub:
  enabled: false
  vlabs:
    openlab:
      image:
        tag: latest
      configuration:
        base_image_tags_url: https://github.com/NaaVRE/flavors/releases/latest/download/base_image_tags.json
        cell_github_url: https://github.com/NaaVRE/cells-vl-tests
        cell_github_token: ghp_XXXXXXXXXXXXXXXX
        registry_url: ghcr.io/naavre/naavre-cells-vl-tests
        module_mapping_url: https://raw.githubusercontent.com/NaaVRE/NaaVRE-conf/main/module_mapping.json

naavreContainerizerService:
  enabled: false
  conf:
    built_in_function_url: https://raw.githubusercontent.com/NaaVRE/NaaVRE-conf/refs/heads/main/build_in_r_function_names.json

naavreWorkflowService:
  enabled: true

k8sSecretCreator:
  enabled: true

